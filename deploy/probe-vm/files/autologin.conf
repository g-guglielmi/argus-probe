# DEBUG (temporary): auto-log-in as root on the console so an un-enrolled VM can be inspected via the
# hypervisor console without a password. Installed as a getty drop-in on tty1 / ttyS0 / hvc0. REMOVE
# once the image's first-boot networking + enrollment are confirmed - a golden image must not ship an
# unauthenticated console login.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
