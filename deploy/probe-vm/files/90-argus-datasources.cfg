# Argus probe VM: which cloud-init datasources to search on the deployed VM. NoCloud covers a seed
# ISO (the Add-probe "VM" output) attached as a CD/USB; ConfigDrive covers OpenStack-style config
# drives (XCP-NG / libvirt). None lets boot proceed cleanly when neither is present, so the
# first-boot setup page can take over. Order matters: seed data wins over an absent datasource.
datasource_list: [ NoCloud, ConfigDrive, None ]
