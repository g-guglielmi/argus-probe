# Networking on the probe VM is owned by systemd-networkd (see /etc/systemd/network/10-argus-dhcp.network),
# not cloud-init - so it comes up on any network regardless of whether cloud-init runs. cloud-init is
# told not to touch networking, so the two never fight when a seed IS attached. cloud-init still does
# enrollment (write_files probe.env + runcmd) when a seed provides it.
network:
  config: disabled
