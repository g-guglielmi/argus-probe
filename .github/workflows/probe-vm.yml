name: probe-vm

# Golden image build for the self-configuring probe VM (§14a). Kept out of the main build workflow
# because a full VM build under TCG is minutes-long - it runs only on demand (workflow_dispatch) or
# when a `probe-vm/v*` tag is pushed (which also publishes a GitHub Release with the image assets).
# Every push that touches deploy/probe-vm/ still gets a fast `packer validate` sanity check.

on:
  push:
    branches: [main]
    paths: ['deploy/probe-vm/**', '.github/workflows/probe-vm.yml']
    tags: ['probe-vm/v*']
  workflow_dispatch:

permissions:
  contents: write   # publish the Release + upload image assets on a tag build

defaults:
  run:
    working-directory: deploy/probe-vm

jobs:
  # Cheap gate on every touch: the template parses and its plugins resolve. No VM is built.
  validate:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-packer@main
      - run: packer init argus-probe-vm.pkr.hcl
      - run: packer validate argus-probe-vm.pkr.hcl

  # Full build: only on manual dispatch or a probe-vm/v* tag.
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU + ISO tooling
        run: |
          sudo apt-get update
          # xorriso builds the cloud-init "cidata" seed CD that Packer attaches for SSH bootstrap.
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso

      - uses: hashicorp/setup-packer@main

      - name: Build the golden image
        run: |
          packer init argus-probe-vm.pkr.hcl
          PACKER_LOG=1 packer build argus-probe-vm.pkr.hcl

      - name: Convert to VHD (XCP-NG / Hyper-V import)
        run: |
          qemu-img convert -f qcow2 -O vpc -o subformat=dynamic \
            output/argus-probe-vm.qcow2 output/argus-probe-vm.vhd
          ls -lh output/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argus-probe-vm
          path: |
            deploy/probe-vm/output/argus-probe-vm.qcow2
            deploy/probe-vm/output/argus-probe-vm.vhd
          if-no-files-found: error

      # GitHub caps a Release asset at 2 GiB; the VHD is larger, and a Debian+Docker disk gzips to a
      # fraction of its size. Compress it for the Release (the raw VHD stays in the workflow artifact
      # above for anyone who wants it un-gzipped).
      - name: Compress VHD for the Release
        if: github.ref_type == 'tag'
        # run steps default to working-directory deploy/probe-vm, so paths are relative to it (uses:
        # actions like upload/release are not, hence their deploy/probe-vm/ prefix).
        run: |
          gzip -f output/argus-probe-vm.vhd
          ls -lh output/

      - name: Publish Release (tag builds only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # Mark as a pre-release so the probe-image versioning track (probe-vm/vX.Y.Z) never claims
          # the repo's "Latest" badge - that belongs to the app's vX.Y.Z releases. GitHub has one flat
          # release list, so this keeps the two series visually distinct.
          prerelease: true
          files: |
            deploy/probe-vm/output/argus-probe-vm.qcow2
            deploy/probe-vm/output/argus-probe-vm.vhd.gz
          body: |
            Argus probe golden image (${{ github.ref_name }}).

            - `argus-probe-vm.qcow2` - KVM/libvirt, or convert as needed.
            - `argus-probe-vm.vhd.gz` - import into XCP-NG (as a VDI) or Hyper-V. **gunzip first:**
              `gunzip argus-probe-vm.vhd.gz`.

            Deploy: create a VM from the disk, then either paste the cloud-init user-data from the
            Argus **Add probe -> VM (cloud-init)** output, or boot it and use the first-boot setup
            page. See deploy/probe-vm/README.md.
